<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClinicalHours — Clinic Admin Portal</title>
<style>
:root {
  --bg-primary: #ffffff;
  --bg-secondary: #f7f7f5;
  --bg-tertiary: #efeeec;
  --text-primary: #1a1a1a;
  --text-secondary: #6b6b6b;
  --text-tertiary: #9b9b9b;
  --border: #e5e5e2;
  --border-light: #ededea;
  --accent: #1D9E75;
  --accent-hover: #178a67;
  --accent-bg: #EAF3DE;
  --accent-text: #27500A;
  --danger: #D93636;
  --danger-bg: #FEF0EF;
  --danger-text: #9E1A1A;
  --amber-bg: #FEF5E7;
  --amber-text: #7A4510;
  --blue-bg: #EBF4FB;
  --blue-text: #0C447C;
  --radius: 8px;
  --radius-lg: 12px;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 30px rgba(0,0,0,0.12);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font); background: var(--bg-secondary); color: var(--text-primary); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; font-size: 13px; }

/* ========== LAYOUT ========== */
.shell { display: flex; height: 100vh; overflow: hidden; }
.sidebar { width: 224px; background: var(--bg-primary); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
.sidebar-logo { padding: 20px 18px 16px; border-bottom: 1px solid var(--border-light); }
.sidebar-logo h1 { font-size: 15px; font-weight: 600; color: var(--text-primary); letter-spacing: -0.3px; }
.sidebar-logo p { font-size: 12px; color: var(--text-tertiary); margin-top: 2px; }
.sidebar-nav { padding: 10px; flex: 1; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: var(--radius); cursor: pointer; font-size: 13px; color: var(--text-secondary); margin-bottom: 2px; transition: all 0.15s; border: none; background: none; width: 100%; text-align: left; font-weight: 400; }
.nav-item:hover { background: var(--bg-secondary); color: var(--text-primary); }
.nav-item.active { background: var(--accent-bg); color: var(--accent-text); font-weight: 500; }
.nav-item svg { width: 16px; height: 16px; flex-shrink: 0; opacity: 0.65; }
.nav-item.active svg { opacity: 1; }
.nav-badge { margin-left: auto; background: var(--danger); color: #fff; font-size: 10px; font-weight: 600; padding: 1px 7px; border-radius: 99px; line-height: 16px; }
.sidebar-footer { padding: 14px 18px; border-top: 1px solid var(--border-light); }
.sidebar-footer p { font-size: 12px; color: var(--text-tertiary); }
.sidebar-footer strong { color: var(--text-secondary); font-weight: 500; }

.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
.topbar { padding: 16px 24px; border-bottom: 1px solid var(--border); background: var(--bg-primary); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.topbar-left h2 { font-size: 16px; font-weight: 600; color: var(--text-primary); }
.topbar-left p { font-size: 12px; color: var(--text-tertiary); margin-top: 1px; }
.topbar-actions { display: flex; gap: 8px; }
.content { flex: 1; overflow-y: auto; padding: 20px 24px; }

/* ========== BUTTONS ========== */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: var(--radius); font-size: 13px; font-weight: 450; border: 1px solid var(--border); background: var(--bg-primary); color: var(--text-primary); cursor: pointer; transition: all 0.15s; white-space: nowrap; line-height: 1.3; }
.btn:hover { background: var(--bg-secondary); border-color: var(--border); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-danger { color: var(--danger); border-color: #f0c8c8; }
.btn-danger:hover { background: var(--danger-bg); }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn-icon { width: 32px; height: 32px; padding: 0; justify-content: center; }
.btn svg { width: 14px; height: 14px; flex-shrink: 0; }

/* ========== CARDS & STATS ========== */
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
.stat-card { background: var(--bg-primary); border: 1px solid var(--border-light); border-radius: var(--radius-lg); padding: 16px 18px; }
.stat-card .label { font-size: 12px; color: var(--text-tertiary); margin-bottom: 6px; font-weight: 450; }
.stat-card .value { font-size: 28px; font-weight: 600; color: var(--text-primary); line-height: 1; }
.stat-card .delta { font-size: 11px; color: var(--accent); margin-top: 6px; font-weight: 500; }

.section-title { font-size: 11px; font-weight: 600; color: var(--text-tertiary); letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 10px; }
.card { background: var(--bg-primary); border: 1px solid var(--border-light); border-radius: var(--radius-lg); overflow: hidden; }

/* ========== POSITIONS GRID ========== */
.pos-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
.pos-card { background: var(--bg-primary); border: 1px solid var(--border-light); border-radius: var(--radius-lg); padding: 16px; cursor: pointer; transition: all 0.15s; }
.pos-card:hover { border-color: var(--border); box-shadow: var(--shadow-sm); }
.pos-card h3 { font-size: 14px; font-weight: 500; color: var(--text-primary); margin-bottom: 4px; }
.pos-card .meta { font-size: 12px; color: var(--text-tertiary); }
.pos-card .footer { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
.pos-add { background: var(--bg-secondary); border: 1px dashed var(--border); border-radius: var(--radius-lg); padding: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; color: var(--text-secondary); transition: all 0.15s; min-height: 100px; }
.pos-add:hover { background: var(--bg-tertiary); color: var(--text-primary); }

/* ========== PILLS ========== */
.pill { font-size: 11px; padding: 3px 10px; border-radius: 99px; font-weight: 500; display: inline-block; line-height: 1.4; }
.pill-green { background: var(--accent-bg); color: var(--accent-text); }
.pill-amber { background: var(--amber-bg); color: var(--amber-text); }
.pill-blue { background: var(--blue-bg); color: var(--blue-text); }
.pill-gray { background: var(--bg-tertiary); color: var(--text-secondary); }
.pill-red { background: var(--danger-bg); color: var(--danger-text); }

/* ========== APPLICATION ROWS ========== */
.app-list { display: flex; flex-direction: column; gap: 6px; }
.app-row { background: var(--bg-primary); border: 1px solid var(--border-light); border-radius: var(--radius); overflow: hidden; transition: border-color 0.15s; }
.app-row:hover { border-color: var(--border); }
.app-header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; }
.avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex-shrink: 0; }
.avatar-green { background: var(--accent-bg); color: var(--accent-text); }
.avatar-blue { background: var(--blue-bg); color: var(--blue-text); }
.avatar-amber { background: var(--amber-bg); color: var(--amber-text); }
.app-info { flex: 1; min-width: 0; }
.app-info h4 { font-size: 13px; font-weight: 500; color: var(--text-primary); }
.app-info p { font-size: 12px; color: var(--text-tertiary); }
.app-actions { display: flex; gap: 6px; }
.chevron { font-size: 12px; color: var(--text-tertiary); transition: transform 0.2s; margin-left: 4px; user-select: none; }
.app-row.expanded .chevron { transform: rotate(180deg); }
.app-detail { border-top: 1px solid var(--border-light); padding: 16px; background: var(--bg-secondary); display: none; }
.app-row.expanded .app-detail { display: block; }
.detail-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 12px; margin-bottom: 14px; }
.detail-item .label { font-size: 11px; color: var(--text-tertiary); margin-bottom: 2px; font-weight: 450; }
.detail-item .val { font-size: 13px; color: var(--text-primary); font-weight: 450; }
.activity-list { margin-bottom: 14px; }
.activity-list .title { font-size: 11px; color: var(--text-tertiary); font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 6px; }
.activity-row { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--text-secondary); padding: 5px 0; }
.activity-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.dot-green { background: var(--accent); }
.dot-blue { background: #378ADD; }
.dot-amber { background: #F59E0B; }
.dot-red { background: var(--danger); }
.dot-gray { background: #b0b0aa; }
.action-row { display: flex; gap: 8px; flex-wrap: wrap; }

/* ========== TOOLBAR (filters/search) ========== */
.toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.search-box { position: relative; flex: 1; max-width: 280px; }
.search-box input { width: 100%; padding: 8px 12px 8px 34px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 13px; background: var(--bg-primary); color: var(--text-primary); outline: none; transition: border-color 0.15s; }
.search-box input:focus { border-color: var(--accent); }
.search-box input::placeholder { color: var(--text-tertiary); }
.search-box svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-tertiary); }
.filter-select { padding: 8px 30px 8px 12px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 13px; background: var(--bg-primary); color: var(--text-primary); outline: none; appearance: none; background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%239b9b9b' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"); background-repeat: no-repeat; background-position: right 10px center; cursor: pointer; }
.filter-select:focus { border-color: var(--accent); }
.toolbar-count { font-size: 12px; color: var(--text-tertiary); margin-left: auto; }

/* ========== CALENDAR ========== */
.cal-container { display: grid; grid-template-columns: 1fr 300px; gap: 20px; }
.cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.cal-header h3 { font-size: 15px; font-weight: 600; }
.cal-nav { display: flex; gap: 6px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
.cal-day-label { text-align: center; font-size: 11px; font-weight: 600; color: var(--text-tertiary); padding: 8px 0; text-transform: uppercase; letter-spacing: 0.3px; }
.cal-day { min-height: 80px; border: 1px solid var(--border-light); padding: 6px; cursor: pointer; transition: background 0.1s; position: relative; }
.cal-day:hover { background: var(--bg-secondary); }
.cal-day.today { background: #f0faf4; }
.cal-day.other-month { opacity: 0.35; }
.cal-day .day-num { font-size: 12px; font-weight: 500; color: var(--text-primary); margin-bottom: 4px; }
.cal-day.today .day-num { color: var(--accent); font-weight: 600; }
.cal-event { font-size: 10px; background: var(--accent-bg); color: var(--accent-text); padding: 2px 6px; border-radius: 4px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.cal-sidebar { background: var(--bg-primary); border: 1px solid var(--border-light); border-radius: var(--radius-lg); padding: 18px; }
.cal-sidebar h3 { font-size: 14px; font-weight: 600; margin-bottom: 14px; }
.interview-item { padding: 12px; background: var(--bg-secondary); border-radius: var(--radius); margin-bottom: 8px; }
.interview-item h4 { font-size: 13px; font-weight: 500; margin-bottom: 2px; }
.interview-item p { font-size: 12px; color: var(--text-tertiary); }
.interview-item .actions { display: flex; gap: 6px; margin-top: 8px; }

/* ========== POSITIONS PAGE ========== */
.positions-list { display: flex; flex-direction: column; gap: 10px; }
.position-card-full { background: var(--bg-primary); border: 1px solid var(--border-light); border-radius: var(--radius-lg); padding: 18px 20px; display: flex; align-items: center; gap: 16px; transition: border-color 0.15s; }
.position-card-full:hover { border-color: var(--border); }
.position-card-full .info { flex: 1; }
.position-card-full h3 { font-size: 14px; font-weight: 500; margin-bottom: 3px; }
.position-card-full .meta { font-size: 12px; color: var(--text-tertiary); }
.position-card-full .stats { display: flex; gap: 20px; align-items: center; }
.position-card-full .stat-item { text-align: center; }
.position-card-full .stat-item .num { font-size: 18px; font-weight: 600; color: var(--text-primary); }
.position-card-full .stat-item .lbl { font-size: 11px; color: var(--text-tertiary); }

/* ========== EMAIL PAGE ========== */
.email-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.email-compose { background: var(--bg-primary); border: 1px solid var(--border-light); border-radius: var(--radius-lg); padding: 20px; }
.email-compose h3 { font-size: 14px; font-weight: 600; margin-bottom: 16px; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 12px; font-weight: 500; color: var(--text-secondary); margin-bottom: 5px; }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 13px; background: var(--bg-primary); color: var(--text-primary); outline: none; transition: border-color 0.15s; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent); }
.form-group textarea { min-height: 160px; resize: vertical; line-height: 1.5; }
.email-log { background: var(--bg-primary); border: 1px solid var(--border-light); border-radius: var(--radius-lg); padding: 20px; }
.email-log h3 { font-size: 14px; font-weight: 600; margin-bottom: 16px; }
.email-entry { padding: 12px; border-bottom: 1px solid var(--border-light); cursor: pointer; transition: background 0.1s; }
.email-entry:last-child { border-bottom: none; }
.email-entry:hover { background: var(--bg-secondary); }
.email-entry h4 { font-size: 13px; font-weight: 500; margin-bottom: 2px; }
.email-entry .meta { font-size: 12px; color: var(--text-tertiary); }
.email-entry .body-preview { font-size: 12px; color: var(--text-secondary); margin-top: 4px; display: none; white-space: pre-wrap; background: var(--bg-tertiary); padding: 10px; border-radius: var(--radius); }
.email-entry.expanded .body-preview { display: block; }

/* ========== HISTORY PAGE ========== */
.timeline { position: relative; padding-left: 24px; }
.timeline::before { content: ''; position: absolute; left: 7px; top: 8px; bottom: 8px; width: 2px; background: var(--border); }
.timeline-item { position: relative; padding: 8px 0 8px 12px; }
.timeline-dot { position: absolute; left: -21px; top: 13px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--bg-secondary); }
.timeline-item .time { font-size: 11px; color: var(--text-tertiary); margin-bottom: 2px; font-weight: 450; }
.timeline-item .desc { font-size: 13px; color: var(--text-primary); }
.timeline-item .sub { font-size: 12px; color: var(--text-secondary); margin-top: 1px; }

/* ========== MODAL ========== */
.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 1000; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.15s; }
.modal-backdrop.visible { opacity: 1; }
.modal { background: var(--bg-primary); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; }
.modal-header { padding: 18px 20px; border-bottom: 1px solid var(--border-light); display: flex; align-items: center; justify-content: space-between; }
.modal-header h3 { font-size: 15px; font-weight: 600; }
.modal-close { width: 28px; height: 28px; border: none; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: var(--radius); color: var(--text-tertiary); font-size: 18px; }
.modal-close:hover { background: var(--bg-secondary); color: var(--text-primary); }
.modal-body { padding: 20px; }
.modal-footer { padding: 14px 20px; border-top: 1px solid var(--border-light); display: flex; justify-content: flex-end; gap: 8px; }

/* ========== EMPTY STATE ========== */
.empty-state { text-align: center; padding: 48px 20px; color: var(--text-tertiary); }
.empty-state svg { width: 40px; height: 40px; margin-bottom: 12px; opacity: 0.4; }
.empty-state h4 { font-size: 14px; font-weight: 500; color: var(--text-secondary); margin-bottom: 4px; }
.empty-state p { font-size: 13px; }

/* ========== TOAST ========== */
.toast { position: fixed; bottom: 24px; right: 24px; background: var(--text-primary); color: #fff; padding: 12px 18px; border-radius: var(--radius); font-size: 13px; font-weight: 450; z-index: 2000; box-shadow: var(--shadow-lg); transform: translateY(80px); opacity: 0; transition: all 0.3s ease; }
.toast.show { transform: translateY(0); opacity: 1; }

/* ========== SCROLLBAR ========== */
.content::-webkit-scrollbar { width: 6px; }
.content::-webkit-scrollbar-track { background: transparent; }
.content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.content::-webkit-scrollbar-thumb:hover { background: var(--text-tertiary); }
</style>
</head>

<script>

function getInitials(name) {
  return name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function fmtDate(d) {
  if (!d) return '—';
  const date = new Date(d + 'T00:00:00');
  return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function fmtDateTime(d, t) {
  if (!d) return '—';
  const date = new Date(d + 'T' + (t || '00:00'));
  return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ', ' +
    date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}

function fmtTime(t) {
  if (!t) return '';
  const [h, m] = t.split(':');
  const d = new Date(2000, 0, 1, +h, +m);
  return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}

function relTime(dateStr) {
  const d = new Date(dateStr);
  const now = new Date();
  const diff = now - d;
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return 'Just now';
  if (mins < 60) return mins + 'm ago';
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + 'h ago';
  const days = Math.floor(hrs / 24);
  if (days < 7) return days + 'd ago';
  return fmtDate(dateStr.split('T')[0]);
}

let store;

function loadStore() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      store = JSON.parse(raw);
      if (!store.positions || !store.applicants) throw new Error('bad');
    } else {
      store = JSON.parse(JSON.stringify(DEFAULT_DATA));
      saveStore();
    }
  } catch {
    store = JSON.parse(JSON.stringify(DEFAULT_DATA));
    saveStore();
  }
}

function saveStore() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
}

function resetStore() {
  store = JSON.parse(JSON.stringify(DEFAULT_DATA));
  saveStore();
}

function addEvent(type, desc, applicantId, positionId) {
  store.events.push({ id: uid(), type, desc, applicantId: applicantId || null, positionId: positionId || null, ts: new Date().toISOString() });
  saveStore();
}

function getPosition(id) { return store.positions.find(p => p.id === id); }
function getApplicant(id) { return store.applicants.find(a => a.id === id); }
function getApplicantsForPosition(posId) { return store.applicants.filter(a => a.positionId === posId); }
function getEventsForApplicant(appId) { return store.events.filter(e => e.applicantId === appId).sort((a, b) => new Date(b.ts) - new Date(a.ts)); }

function getStats() {
  const apps = store.applicants;
  return {
    total: apps.length,
    pending: apps.filter(a => a.status === 'new' || a.status === 'under_review').length,
    interviews: apps.filter(a => a.status === 'interview_scheduled').length,
    openPositions: store.positions.filter(p => p.status !== 'closed').length
  };
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.remove('show'), 2500);
}

// =====================================================================
//  MODAL SYSTEM
// =====================================================================
function showModal(html) {
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal-backdrop" onclick="if(event.target===this)hideModal()"><div class="modal">${html}</div></div>`;
  requestAnimationFrame(() => root.querySelector('.modal-backdrop').classList.add('visible'));
  document.addEventListener('keydown', onModalKey);
}

function hideModal() {
  const root = document.getElementById('modal-root');
  const bd = root.querySelector('.modal-backdrop');
  if (bd) { bd.classList.remove('visible'); setTimeout(() => { root.innerHTML = ''; }, 150); }
  document.removeEventListener('keydown', onModalKey);
}

function onModalKey(e) { if (e.key === 'Escape') hideModal(); }

let currentPage = 'overview';

  { id: 'overview', label: 'Overview', icon: 'overview' },

function navigate(page) {
  currentPage = page;
  pageState = {};
  renderSidebar();
  renderTopbar();
  renderPage();
}

function renderSidebar() {
  const pendingCount = store.applicants.filter(a => a.status === 'new' || a.status === 'under_review').length;
  document.getElementById('sidebar-nav').innerHTML = PAGES.map(p =>
    `<button class="nav-item${currentPage === p.id ? ' active' : ''}" onclick="navigate('${p.id}')">
      ${ICONS[p.icon]}
      ${p.label}
      ${p.badge && pendingCount > 0 ? `<span class="nav-badge">${pendingCount}</span>` : ''}
    </button>`
  ).join('') + `<div style="flex:1"></div><button class="nav-item" onclick="confirmReset()" style="margin-top:auto;opacity:0.6">${ICONS.reset} Reset data</button>`;
}

function confirmReset() {
  showModal(`
    <div class="modal-header"><h3>Reset all data?</h3><button class="modal-close" onclick="hideModal()">&times;</button></div>
    <div class="modal-body"><p style="font-size:13px;color:var(--text-secondary)">This will restore all positions, applicants, emails, and history to the original demo data. This cannot be undone.</p></div>
    <div class="modal-footer"><button class="btn" onclick="hideModal()">Cancel</button><button class="btn btn-primary" onclick="resetStore();hideModal();navigate(currentPage);showToast('Data reset to defaults')">Reset</button></div>
  `);
}

function renderTopbar() {
  const topbar = document.getElementById('topbar');
  const titles = {
    overview: ['Admin overview', 'Spring 2025 cycle'],
    applications: ['Applications', `${store.applicants.length} total applicants`],
    interviews: ['Interview calendar', 'Scheduled interviews and availability'],
    positions: ['Volunteer positions', `${store.positions.length} positions`],
    email: ['Email', 'Compose and track messages'],
    history: ['Activity history', 'Timeline of all events']
  };
  const [title, sub] = titles[currentPage] || ['', ''];
  let actions = '';
  if (currentPage === 'overview') {
    actions = `<button class="btn" onclick="navigate('email')">${ICONS.send} Send emails</button><button class="btn btn-primary" onclick="openPositionModal()">${ICONS.plus} Add position</button>`;
  } else if (currentPage === 'applications') {
    actions = `<button class="btn btn-primary" onclick="openAddApplicantModal()">${ICONS.plus} Add applicant</button>`;
  } else if (currentPage === 'positions') {
    actions = `<button class="btn btn-primary" onclick="openPositionModal()">${ICONS.plus} Add position</button>`;
  } else if (currentPage === 'email') {
    actions = '';
  }
  topbar.innerHTML = `<div class="topbar-left"><h2>${title}</h2><p>${sub}</p></div><div class="topbar-actions">${actions}</div>`;
}

function renderPage() {
  const c = document.getElementById('content');
  switch (currentPage) {
    case 'overview': c.innerHTML = renderOverview(); break;
    case 'applications': c.innerHTML = renderApplications(); break;
    case 'interviews': c.innerHTML = renderInterviews(); break;
    case 'positions': c.innerHTML = renderPositions(); break;
    case 'email': c.innerHTML = renderEmail(); break;
    case 'history': c.innerHTML = renderHistory(); break;
  }
  document.getElementById('content').scrollTop = 0;
}

// ---------- OVERVIEW ----------
function renderOverview() {
  const s = getStats();
  const recent = [...store.applicants].sort((a, b) => new Date(b.appliedAt) - new Date(a.appliedAt)).slice(0, 5);
  return `
    <div class="stat-grid">
      <div class="stat-card"><div class="label">Total applicants</div><div class="value">${s.total}</div><div class="delta">Spring 2025</div></div>
      <div class="stat-card"><div class="label">Pending review</div><div class="value">${s.pending}</div></div>
      <div class="stat-card"><div class="label">Interviews scheduled</div><div class="value">${s.interviews}</div></div>
      <div class="stat-card"><div class="label">Open positions</div><div class="value">${s.openPositions}</div></div>
    </div>
    <div class="section-title">Positions</div>
    <div class="pos-grid">
      ${store.positions.map(p => {
        const count = getApplicantsForPosition(p.id).length;
        const pillClass = p.status === 'open' ? 'pill-green' : p.status === 'reviewing' ? 'pill-amber' : 'pill-gray';
        return `<div class="pos-card" onclick="navigate('positions')">
          <h3>${esc(p.title)}</h3>
          <div class="meta">${esc(p.schedule)} · ${p.hoursPerWeek}h/week</div>
          <div class="footer">
            <span class="pill ${pillClass}">${cap(p.status)}</span>
            <span style="font-size:12px;color:var(--text-tertiary)">${count} applicant${count !== 1 ? 's' : ''}</span>

      }).join('')}
      <div class="pos-add" onclick="openPositionModal()">${ICONS.plus} Add position</div>
    </div>
    <div class="section-title">Recent applications</div>
    <div class="app-list">
      ${recent.map(a => renderAppRow(a)).join('')}
    </div>`;
}

        ${renderActionButtons(a)}

}

function renderActionButtons(a) {
  let btns = '';
  if (a.status === 'new') {
    btns += `<button class="btn btn-sm" onclick="changeStatus('${a.id}','under_review')">Mark reviewing</button>`;
    btns += `<button class="btn btn-primary btn-sm" onclick="openScheduleModal('${a.id}')">Schedule interview</button>`;
    btns += `<button class="btn btn-sm" onclick="openEmailModalFor('${a.id}')">Send email</button>`;
    btns += `<button class="btn btn-danger btn-sm" onclick="confirmDecline('${a.id}')">Decline</button>`;
  } else if (a.status === 'under_review') {
    btns += `<button class="btn btn-primary btn-sm" onclick="openScheduleModal('${a.id}')">Schedule interview</button>`;
    btns += `<button class="btn btn-sm" onclick="openEmailModalFor('${a.id}')">Send email</button>`;
    btns += `<button class="btn btn-danger btn-sm" onclick="confirmDecline('${a.id}')">Decline</button>`;
  } else if (a.status === 'interview_scheduled') {
    btns += `<button class="btn btn-primary btn-sm" onclick="changeStatus('${a.id}','accepted')">${ICONS.check} Accept</button>`;
    btns += `<button class="btn btn-sm" onclick="openScheduleModal('${a.id}')">Reschedule</button>`;
    btns += `<button class="btn btn-sm" onclick="openEmailModalFor('${a.id}')">Send reminder</button>`;
    btns += `<button class="btn btn-danger btn-sm" onclick="confirmDecline('${a.id}')">Decline</button>`;
  } else if (a.status === 'accepted') {
    btns += `<button class="btn btn-sm" onclick="openEmailModalFor('${a.id}')">Send email</button>`;
  } else if (a.status === 'declined') {
    btns += `<button class="btn btn-sm" onclick="changeStatus('${a.id}','new')">Reopen</button>`;
    btns += `<button class="btn btn-sm" onclick="openEmailModalFor('${a.id}')">Send email</button>`;
  }
  return btns;
}

function statusToPill(status) {
  const map = {
    new: { label: 'New', cls: 'pill-gray' },
    under_review: { label: 'Under review', cls: 'pill-amber' },
    interview_scheduled: { label: 'Interview set', cls: 'pill-blue' },
    accepted: { label: 'Accepted', cls: 'pill-green' },
    declined: { label: 'Declined', cls: 'pill-red' }
  };
  return map[status] || { label: status, cls: 'pill-gray' };
}

function eventDotColor(type) {
  const map = { application: 'dot-blue', status: 'dot-amber', email: 'dot-gray', interview: 'dot-green' };
  return map[type] || 'dot-gray';
}

function toggleRow(id) {
  document.getElementById('row-' + id)?.classList.toggle('expanded');
}

// ---------- APPLICATIONS ----------
function renderApplications() {
  let apps = [...store.applicants];
  const search = (pageState.search || '').toLowerCase();
  const statusFilter = pageState.statusFilter || 'all';
  const posFilter = pageState.posFilter || 'all';
  const sort = pageState.sort || 'newest';

  if (search) apps = apps.filter(a => a.name.toLowerCase().includes(search) || a.email.toLowerCase().includes(search));
  if (statusFilter !== 'all') apps = apps.filter(a => a.status === statusFilter);
  if (posFilter !== 'all') apps = apps.filter(a => a.positionId === posFilter);

  if (sort === 'newest') apps.sort((a, b) => new Date(b.appliedAt) - new Date(a.appliedAt));
  else if (sort === 'oldest') apps.sort((a, b) => new Date(a.appliedAt) - new Date(b.appliedAt));
  else if (sort === 'name') apps.sort((a, b) => a.name.localeCompare(b.name));
  else if (sort === 'gpa') apps.sort((a, b) => b.gpa - a.gpa);

  return `
    <div class="toolbar">
      <div class="search-box">
        ${ICONS.search}
        <input type="text" placeholder="Search by name or email..." value="${esc(pageState.search || '')}" oninput="pageState.search=this.value;renderPage()">
      </div>
      <select class="filter-select" onchange="pageState.statusFilter=this.value;renderPage()">
        <option value="all"${statusFilter === 'all' ? ' selected' : ''}>All statuses</option>
        <option value="new"${statusFilter === 'new' ? ' selected' : ''}>New</option>
        <option value="under_review"${statusFilter === 'under_review' ? ' selected' : ''}>Under review</option>
        <option value="interview_scheduled"${statusFilter === 'interview_scheduled' ? ' selected' : ''}>Interview set</option>
        <option value="accepted"${statusFilter === 'accepted' ? ' selected' : ''}>Accepted</option>
        <option value="declined"${statusFilter === 'declined' ? ' selected' : ''}>Declined</option>
      </select>
      <select class="filter-select" onchange="pageState.posFilter=this.value;renderPage()">
        <option value="all"${posFilter === 'all' ? ' selected' : ''}>All positions</option>
        ${store.positions.map(p => `<option value="${p.id}"${posFilter === p.id ? ' selected' : ''}>${esc(p.title)}</option>`).join('')}
      </select>
      <select class="filter-select" onchange="pageState.sort=this.value;renderPage()">
        <option value="newest"${sort === 'newest' ? ' selected' : ''}>Newest first</option>
        <option value="oldest"${sort === 'oldest' ? ' selected' : ''}>Oldest first</option>
        <option value="name"${sort === 'name' ? ' selected' : ''}>Name A-Z</option>
        <option value="gpa"${sort === 'gpa' ? ' selected' : ''}>Highest GPA</option>
      </select>
      <span class="toolbar-count">${apps.length} result${apps.length !== 1 ? 's' : ''}</span>
    </div>
    <div class="app-list">
      ${apps.length > 0 ? apps.map(a => renderAppRow(a)).join('') : `<div class="empty-state"><h4>No applications found</h4><p>Try adjusting your filters or search query.</p></div>`}
    </div>`;
}

// ---------- INTERVIEWS ----------
function renderInterviews() {
  const now = new Date();
  const viewYear = pageState.calYear || now.getFullYear();
  const viewMonth = pageState.calMonth !== undefined ? pageState.calMonth : now.getMonth();

  const interviews = store.applicants.filter(a => a.status === 'interview_scheduled' && a.interviewDate);
  const upcoming = [...interviews].sort((a, b) => new Date(a.interviewDate) - new Date(b.interviewDate));

  const firstDay = new Date(viewYear, viewMonth, 1);
  const lastDay = new Date(viewYear, viewMonth + 1, 0);
  const startDow = firstDay.getDay();
  const daysInMonth = lastDay.getDate();

  const monthName = firstDay.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

  let calCells = '';
  ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].forEach(d => {
    calCells += `<div class="cal-day-label">${d}</div>`;
  });

  const prevMonth = new Date(viewYear, viewMonth, 0);
  const prevDays = prevMonth.getDate();
  for (let i = startDow - 1; i >= 0; i--) {
    calCells += `<div class="cal-day other-month"><div class="day-num">${prevDays - i}</div></div>`;
  }

  const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${viewYear}-${String(viewMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const isToday = dateStr === todayStr;
    const dayInterviews = interviews.filter(a => a.interviewDate === dateStr);
    calCells += `<div class="cal-day${isToday ? ' today' : ''}" onclick="showDayDetail('${dateStr}')">
      <div class="day-num">${d}</div>
      ${dayInterviews.map(a => `<div class="cal-event">${fmtTime(a.interviewTime)} ${esc(a.name.split(' ')[0])}</div>`).join('')}
    </div>`;
  }

  const totalCells = startDow + daysInMonth;
  const remaining = (7 - (totalCells % 7)) % 7;
  for (let i = 1; i <= remaining; i++) {
    calCells += `<div class="cal-day other-month"><div class="day-num">${i}</div></div>`;
  }

  return `
    <div class="cal-container">
      <div>
        <div class="card" style="padding:16px">
          <div class="cal-header">
            <h3>${monthName}</h3>
            <div class="cal-nav">
              <button class="btn btn-icon btn-sm" onclick="calNav(-1)">${ICONS.chevLeft}</button>
              <button class="btn btn-sm" onclick="calToday()">Today</button>
              <button class="btn btn-icon btn-sm" onclick="calNav(1)">${ICONS.chevRight}</button>
            </div>
          </div>
          <div class="cal-grid">${calCells}</div>
        </div>
      </div>
      <div class="cal-sidebar">
        <h3>Upcoming interviews</h3>
        ${upcoming.length === 0 ? '<div style="font-size:13px;color:var(--text-tertiary);padding:12px 0">No interviews scheduled</div>' : ''}
        ${upcoming.map(a => {
          const pos = getPosition(a.positionId);
          return `<div class="interview-item">
            <h4>${esc(a.name)}</h4>
            <p>${pos ? esc(pos.title) : ''}</p>
            <p style="color:var(--text-primary);font-weight:500;margin-top:4px">${fmtDateTime(a.interviewDate, a.interviewTime)}</p>
            <div class="actions">
              <button class="btn btn-primary btn-sm" onclick="changeStatus('${a.id}','accepted')">${ICONS.check} Accept</button>
              <button class="btn btn-sm" onclick="openScheduleModal('${a.id}')">Reschedule</button>
              <button class="btn btn-danger btn-sm" onclick="confirmDecline('${a.id}')">Decline</button>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
}

function calNav(dir) {
  const now = new Date();
  let m = pageState.calMonth !== undefined ? pageState.calMonth : now.getMonth();
  let y = pageState.calYear || now.getFullYear();
  m += dir;
  if (m < 0) { m = 11; y--; }
  if (m > 11) { m = 0; y++; }
  pageState.calMonth = m;
  pageState.calYear = y;
  renderPage();
}

function calToday() {
  const now = new Date();
  pageState.calMonth = now.getMonth();
  pageState.calYear = now.getFullYear();
  renderPage();
}

function showDayDetail(dateStr) {
  const dayInterviews = store.applicants.filter(a => a.interviewDate === dateStr && a.status === 'interview_scheduled');
  const d = new Date(dateStr + 'T00:00:00');
  const formatted = d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  showModal(`
    <div class="modal-header"><h3>${formatted}</h3><button class="modal-close" onclick="hideModal()">&times;</button></div>
    <div class="modal-body">
      ${dayInterviews.length === 0 ? '<p style="color:var(--text-tertiary)">No interviews on this day.</p><p style="margin-top:8px;font-size:13px;color:var(--text-secondary)">To schedule an interview, go to Applications and click "Schedule interview" on an applicant.</p>' : ''}
      ${dayInterviews.map(a => {
        const pos = getPosition(a.positionId);
        return `<div class="interview-item" style="margin-bottom:10px">
          <h4>${esc(a.name)}</h4>
          <p>${pos ? esc(pos.title) : ''} · ${fmtTime(a.interviewTime)}</p>
          <div class="actions">
            <button class="btn btn-primary btn-sm" onclick="changeStatus('${a.id}','accepted');hideModal()">${ICONS.check} Accept</button>
            <button class="btn btn-danger btn-sm" onclick="confirmDecline('${a.id}');hideModal()">Decline</button>
          </div>
        </div>`;
      }).join('')}
    </div>
  `);
}

function applyEmailTemplate() {
  const tmpl = document.getElementById('email-template').value;
  const toSelect = document.getElementById('email-to');
  const applicant = toSelect.value ? getApplicant(toSelect.value) : null;
  const name = applicant ? applicant.name.split(' ')[0] : '[Name]';
  const pos = applicant ? getPosition(applicant.positionId) : null;
  const posTitle = pos ? pos.title : '[Position]';
  const subj = document.getElementById('email-subject');
  const body = document.getElementById('email-body');

  const templates = {
    schedule: {
      subject: `Interview Scheduling — ${posTitle}`,
      body: `Hi ${name},\n\nThank you for applying to the ${posTitle} position at BCS Free Health Clinic.\n\nWe'd like to invite you for a brief interview. Please let us know your availability for the coming week.\n\nBest regards,\nDr. Sarah Chen\nBCS Free Health Clinic`
    },
    reminder: {
      subject: `Interview Reminder — ${posTitle}`,
      body: `Hi ${name},\n\nThis is a friendly reminder about your upcoming interview for the ${posTitle} position.\n\nPlease arrive 5 minutes early and bring a valid student ID.\n\nBest regards,\nDr. Sarah Chen\nBCS Free Health Clinic`
    },
    acceptance: {
      subject: `Congratulations! You've been accepted — ${posTitle}`,
      body: `Hi ${name},\n\nWe're pleased to inform you that you've been accepted for the ${posTitle} position at BCS Free Health Clinic!\n\nYou'll receive onboarding details shortly. We're excited to have you on the team.\n\nBest regards,\nDr. Sarah Chen\nBCS Free Health Clinic`
    },
    rejection: {
      subject: `Application Update — ${posTitle}`,
      body: `Hi ${name},\n\nThank you for your interest in the ${posTitle} position at BCS Free Health Clinic.\n\nAfter careful consideration, we've decided to move forward with other candidates at this time. We encourage you to apply again in future cycles.\n\nBest regards,\nDr. Sarah Chen\nBCS Free Health Clinic`
    }
  };

  if (templates[tmpl]) {
    subj.value = templates[tmpl].subject;
    body.value = templates[tmpl].body;
  }
}

function sendEmail() {
  const toEl = document.getElementById('email-to');
  const subjectEl = document.getElementById('email-subject');
  const bodyEl = document.getElementById('email-body');

  if (!toEl.value) { showToast('Please select a recipient'); return; }
  if (!subjectEl.value.trim()) { showToast('Please enter a subject'); return; }
  if (!bodyEl.value.trim()) { showToast('Please enter a message body'); return; }

  const applicant = getApplicant(toEl.value);
  const emailRecord = {
    id: uid(),
    to: applicant.email,
    toName: applicant.name,
    applicantId: applicant.id,
    subject: subjectEl.value.trim(),
    body: bodyEl.value.trim(),
    sentAt: new Date().toISOString()
  };
  store.emails.push(emailRecord);
  addEvent('email', `Email sent: "${emailRecord.subject}"`, applicant.id, applicant.positionId);

  // NOTE: In production, this would trigger a real email delivery via backend API
  showToast(`Email sent to ${applicant.name}`);
  renderPage();
  renderSidebar();
}

function dotBg(type) {

// Schedule Interview
function openScheduleModal(appId) {
  const a = getApplicant(appId);
  if (!a) return;
  const today = new Date().toISOString().split('T')[0];
  showModal(`
    <div class="modal-header"><h3>Schedule interview</h3><button class="modal-close" onclick="hideModal()">&times;</button></div>
    <div class="modal-body">
      <p style="font-size:13px;color:var(--text-secondary);margin-bottom:16px">Scheduling interview for <strong>${esc(a.name)}</strong></p>
      <div class="form-group"><label>Date</label><input type="date" id="sched-date" min="${today}" value="${a.interviewDate || ''}"></div>
      <div class="form-group"><label>Time</label><input type="time" id="sched-time" value="${a.interviewTime || '10:00'}"></div>
      <div style="margin-top:6px">
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-secondary);cursor:pointer">
          <input type="checkbox" id="sched-send-email" checked> Send scheduling email to applicant
        </label>
        <!-- NOTE: The email is logged locally. In production, this would trigger an actual email delivery. -->
      </div>
    </div>
    <div class="modal-footer"><button class="btn" onclick="hideModal()">Cancel</button><button class="btn btn-primary" onclick="submitSchedule('${appId}')">Schedule</button></div>
  `);
}

function submitSchedule(appId) {
  const date = document.getElementById('sched-date').value;
  const time = document.getElementById('sched-time').value;
  const sendEmailChecked = document.getElementById('sched-send-email').checked;

  if (!date) { showToast('Please select a date'); return; }
  if (!time) { showToast('Please select a time'); return; }

  const a = getApplicant(appId);
  a.interviewDate = date;
  a.interviewTime = time;
  a.status = 'interview_scheduled';
  addEvent('interview', `Interview scheduled for ${fmtDateTime(date, time)}`, appId, a.positionId);
  addEvent('status', 'Status changed to Interview Scheduled', appId, a.positionId);

  if (sendEmailChecked) {
    const pos = getPosition(a.positionId);
    const emailRecord = {
      id: uid(),
      to: a.email,
      toName: a.name,
      applicantId: a.id,
      subject: `Interview Scheduled — ${pos ? pos.title : 'Volunteer Position'}`,
      body: `Hi ${a.name.split(' ')[0]},\n\nYour interview has been scheduled for ${fmtDateTime(date, time)}.\n\nPlease arrive 5 minutes early and bring a valid student ID.\n\nBest regards,\nDr. Sarah Chen\nBCS Free Health Clinic`,
      sentAt: new Date().toISOString()
    };
    store.emails.push(emailRecord);
    addEvent('email', `Scheduling email sent: "${emailRecord.subject}"`, a.id, a.positionId);
  }

  saveStore();
  hideModal();
  showToast(`Interview scheduled for ${a.name}`);
  renderSidebar();
  renderTopbar();
  renderPage();
}

// Email Modal (pre-filled for applicant)
function openEmailModalFor(appId) {
  navigate('email');
  setTimeout(() => {
    const toEl = document.getElementById('email-to');
    if (toEl) toEl.value = appId;
  }, 50);
}

// Change Status
function changeStatus(appId, newStatus) {
  const a = getApplicant(appId);
  if (!a) return;
  const oldStatus = a.status;
  a.status = newStatus;

  const labels = { new: 'New', under_review: 'Under Review', interview_scheduled: 'Interview Scheduled', accepted: 'Accepted', declined: 'Declined' };
  addEvent('status', `Status changed to ${labels[newStatus] || newStatus}`, appId, a.positionId);

  if (newStatus === 'accepted') {
    const pos = getPosition(a.positionId);
    const emailRecord = {
      id: uid(), to: a.email, toName: a.name, applicantId: a.id,
      subject: `Congratulations! You've been accepted — ${pos ? pos.title : 'Volunteer Position'}`,
      body: `Hi ${a.name.split(' ')[0]},\n\nWe're pleased to inform you that you've been accepted for the ${pos ? pos.title : ''} position.\n\nYou'll receive onboarding details shortly.\n\nBest regards,\nDr. Sarah Chen\nBCS Free Health Clinic`,
      sentAt: new Date().toISOString()
    };
    store.emails.push(emailRecord);
    addEvent('email', `Acceptance email sent`, a.id, a.positionId);
    // NOTE: Would trigger real email delivery in production
  }

  saveStore();
  showToast(`${a.name} — ${labels[newStatus]}`);
  renderSidebar();
  renderTopbar();
  renderPage();
}

// Decline Confirmation
function confirmDecline(appId) {
  const a = getApplicant(appId);
  if (!a) return;
  showModal(`
    <div class="modal-header"><h3>Decline applicant?</h3><button class="modal-close" onclick="hideModal()">&times;</button></div>
    <div class="modal-body">
      <p style="font-size:13px;color:var(--text-secondary)">Are you sure you want to decline <strong>${esc(a.name)}</strong>?</p>
      <div style="margin-top:12px">
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-secondary);cursor:pointer">
          <input type="checkbox" id="decline-send-email" checked> Send rejection email
        </label>
        <!-- NOTE: The email is logged locally. In production, this would send a real email. -->
      </div>
    </div>
    <div class="modal-footer"><button class="btn" onclick="hideModal()">Cancel</button><button class="btn" style="background:var(--danger);color:#fff;border-color:var(--danger)" onclick="submitDecline('${appId}')">Decline</button></div>
  `);
}

function submitDecline(appId) {
  const sendEmailChecked = document.getElementById('decline-send-email')?.checked;
  const a = getApplicant(appId);
  a.status = 'declined';
  a.interviewDate = null;
  a.interviewTime = null;
  addEvent('status', 'Declined', appId, a.positionId);

  if (sendEmailChecked) {
    const pos = getPosition(a.positionId);
    const emailRecord = {
      id: uid(), to: a.email, toName: a.name, applicantId: a.id,
      subject: `Application Update — ${pos ? pos.title : 'Volunteer Position'}`,
      body: `Hi ${a.name.split(' ')[0]},\n\nThank you for your interest in the ${pos ? pos.title : ''} position.\n\nAfter careful review, we've decided to move forward with other candidates. We encourage you to apply again in future cycles.\n\nBest regards,\nDr. Sarah Chen\nBCS Free Health Clinic`,
      sentAt: new Date().toISOString()
    };
    store.emails.push(emailRecord);
    addEvent('email', `Rejection email sent`, a.id, a.positionId);
  }

  saveStore();
  hideModal();
  showToast(`${a.name} declined`);
  renderSidebar();
  renderTopbar();
  renderPage();
}

// Add/Edit Position
function openPositionModal(posId) {
  const p = posId ? getPosition(posId) : null;
  const isEdit = !!p;
  showModal(`
    <div class="modal-header"><h3>${isEdit ? 'Edit' : 'Add'} position</h3><button class="modal-close" onclick="hideModal()">&times;</button></div>
    <div class="modal-body">
      <div class="form-group"><label>Title</label><input type="text" id="pos-title" value="${p ? esc(p.title) : ''}" placeholder="e.g. Patient Intake Volunteer"></div>
      <div class="form-group"><label>Schedule</label><input type="text" id="pos-schedule" value="${p ? esc(p.schedule) : ''}" placeholder="e.g. Tuesdays, Flexible"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="form-group"><label>Hours/week</label><input type="number" id="pos-hours" min="1" max="40" value="${p ? p.hoursPerWeek : '4'}"></div>
        <div class="form-group"><label>Open slots</label><input type="number" id="pos-slots" min="1" max="50" value="${p ? p.slots : '3'}"></div>
      </div>
      <div class="form-group"><label>Status</label>
        <select id="pos-status">
          <option value="open"${p && p.status === 'open' ? ' selected' : ''}>Open</option>
          <option value="reviewing"${p && p.status === 'reviewing' ? ' selected' : ''}>Reviewing</option>
          <option value="closed"${p && p.status === 'closed' ? ' selected' : ''}>Closed</option>
        </select>
      </div>
      <div class="form-group"><label>Description</label><textarea id="pos-desc" rows="3" placeholder="Brief description of responsibilities...">${p ? esc(p.description || '') : ''}</textarea></div>
    </div>
    <div class="modal-footer"><button class="btn" onclick="hideModal()">Cancel</button><button class="btn btn-primary" onclick="submitPosition('${posId || ''}')">${isEdit ? 'Save changes' : 'Add position'}</button></div>
  `);
}

function submitPosition(posId) {
  const title = document.getElementById('pos-title').value.trim();
  const schedule = document.getElementById('pos-schedule').value.trim();
  const hours = parseInt(document.getElementById('pos-hours').value) || 4;
  const slots = parseInt(document.getElementById('pos-slots').value) || 3;
  const status = document.getElementById('pos-status').value;
  const desc = document.getElementById('pos-desc').value.trim();

  if (!title) { showToast('Please enter a position title'); return; }

  if (posId) {
    const p = getPosition(posId);
    p.title = title; p.schedule = schedule; p.hoursPerWeek = hours; p.slots = slots; p.status = status; p.description = desc;
    addEvent('status', `Position updated: "${title}"`, null, posId);
    showToast('Position updated');
  } else {
    const newPos = { id: uid(), title, schedule, hoursPerWeek: hours, slots, status, description: desc, createdAt: new Date().toISOString().split('T')[0] };
    store.positions.push(newPos);
    addEvent('status', `New position created: "${title}"`, null, newPos.id);
    showToast('Position created');
  }

  saveStore();
  hideModal();
  renderSidebar();
  renderTopbar();
  renderPage();
}

function confirmDeletePosition(posId) {
  const p = getPosition(posId);
  if (!p) return;
  const appCount = getApplicantsForPosition(posId).length;
  showModal(`
    <div class="modal-header"><h3>Delete position?</h3><button class="modal-close" onclick="hideModal()">&times;</button></div>
    <div class="modal-body">
      <p style="font-size:13px;color:var(--text-secondary)">Are you sure you want to delete <strong>${esc(p.title)}</strong>?</p>
      ${appCount > 0 ? `<p style="font-size:13px;color:var(--danger);margin-top:8px">This position has ${appCount} applicant${appCount !== 1 ? 's' : ''} — they will be removed as well.</p>` : ''}
    </div>
    <div class="modal-footer"><button class="btn" onclick="hideModal()">Cancel</button><button class="btn" style="background:var(--danger);color:#fff;border-color:var(--danger)" onclick="deletePosition('${posId}')">Delete</button></div>
  `);
}

function deletePosition(posId) {
  store.positions = store.positions.filter(p => p.id !== posId);
  store.applicants = store.applicants.filter(a => a.positionId !== posId);
  store.events = store.events.filter(e => e.positionId !== posId);
  saveStore();
  hideModal();
  showToast('Position deleted');
  renderSidebar();
  renderTopbar();
  renderPage();
}

// Add Applicant
function openAddApplicantModal() {
  showModal(`
    <div class="modal-header"><h3>Add applicant</h3><button class="modal-close" onclick="hideModal()">&times;</button></div>
    <div class="modal-body">
      <div class="form-group"><label>Full name</label><input type="text" id="new-app-name" placeholder="e.g. Jane Smith"></div>
      <div class="form-group"><label>Email</label><input type="email" id="new-app-email" placeholder="e.g. jane.smith@tamu.edu"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="form-group"><label>GPA</label><input type="number" id="new-app-gpa" step="0.01" min="0" max="4" value="3.5"></div>
        <div class="form-group"><label>Year</label>
          <select id="new-app-year"><option>Freshman</option><option>Sophomore</option><option selected>Junior</option><option>Senior</option></select>
        </div>
      </div>
      <div class="form-group"><label>Major</label><input type="text" id="new-app-major" placeholder="e.g. Biology"></div>
      <div class="form-group"><label>Position</label>
        <select id="new-app-pos">
          ${store.positions.map(p => `<option value="${p.id}">${esc(p.title)}</option>`).join('')}
        </select>
      </div>
      <div class="form-group"><label>Availability</label><input type="text" id="new-app-avail" placeholder="e.g. Tue, Thu afternoons"></div>
      <!-- NOTE: In the real app, students would submit applications through the student portal. This form simulates manual entry by clinic admins for testing purposes. -->
    </div>
    <div class="modal-footer"><button class="btn" onclick="hideModal()">Cancel</button><button class="btn btn-primary" onclick="submitNewApplicant()">Add applicant</button></div>
  `);
}

function submitNewApplicant() {
  const name = document.getElementById('new-app-name').value.trim();
  const email = document.getElementById('new-app-email').value.trim();
  const gpa = parseFloat(document.getElementById('new-app-gpa').value) || 3.0;
  const year = document.getElementById('new-app-year').value;
  const major = document.getElementById('new-app-major').value.trim();
  const positionId = document.getElementById('new-app-pos').value;
  const availability = document.getElementById('new-app-avail').value.trim();

  if (!name) { showToast('Please enter a name'); return; }
  if (!email) { showToast('Please enter an email'); return; }

  const newApp = {
    id: uid(), name, email, gpa, year, major, availability, positionId,
    status: 'new',
    appliedAt: new Date().toISOString().split('T')[0],
    color: AVATAR_COLORS[store.applicants.length % AVATAR_COLORS.length]
  };
  store.applicants.push(newApp);
  addEvent('application', 'Application submitted', newApp.id, positionId);
  // NOTE: In the real system, this would also trigger an auto-confirmation email to the student
  saveStore();
  hideModal();
  showToast(`${name} added as applicant`);
  renderSidebar();
  renderTopbar();
  renderPage();
}

// =====================================================================
//  UTILITIES
// =====================================================================
function esc(str) {
  if (!str) return '';
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function cap(str) {
  if (!str) return '';
  return str.charAt(0).toUpperCase() + str.slice(1).replace(/_/g, ' ');
}

// =====================================================================
//  INIT
// =====================================================================
loadStore();
renderSidebar();
navigate('overview');
</script>
</body>
</html>
