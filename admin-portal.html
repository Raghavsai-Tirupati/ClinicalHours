<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClinicalHours — Clinic Admin Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --sidebar-bg: #0C1222;
  --sidebar-hover: #1a2538;
  --sidebar-active: rgba(56,189,248,0.12);
  --sidebar-text: #94a3b8;
  --sidebar-text-active: #e2e8f0;
  --bg: #f1f5f9;
  --surface: #ffffff;
  --surface-hover: #f8fafc;
  --text: #0f172a;
  --text-secondary: #64748b;
  --text-muted: #94a3b8;
  --border: #e2e8f0;
  --border-light: #f1f5f9;
  --accent: #0d9488;
  --accent-hover: #0f766e;
  --accent-light: #ccfbf1;
  --accent-text: #134e4a;
  --blue: #3b82f6;
  --blue-light: #dbeafe;
  --blue-text: #1e40af;
  --amber: #f59e0b;
  --amber-light: #fef3c7;
  --amber-text: #92400e;
  --red: #ef4444;
  --red-light: #fee2e2;
  --red-text: #991b1b;
  --purple: #8b5cf6;
  --purple-light: #ede9fe;
  --purple-text: #5b21b6;
  --radius: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.05);
  --shadow-lg: 0 10px 25px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.05);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; font-size: 13px; }
::selection { background: var(--accent-light); color: var(--accent-text); }

/* ========== LAYOUT ========== */
.shell { display: flex; height: 100vh; overflow: hidden; }

/* ========== SIDEBAR ========== */
.sidebar { width: 240px; background: var(--sidebar-bg); display: flex; flex-direction: column; flex-shrink: 0; }
.sidebar-brand { padding: 24px 20px 20px; display: flex; align-items: center; gap: 12px; }
.sidebar-brand-icon { width: 36px; height: 36px; background: linear-gradient(135deg, var(--accent), #06b6d4); border-radius: 10px; display: flex; align-items: center; justify-content: center; }
.sidebar-brand-icon svg { width: 20px; height: 20px; color: #fff; }
.sidebar-brand-text h1 { font-size: 15px; font-weight: 700; color: #f1f5f9; letter-spacing: -0.3px; line-height: 1.2; }
.sidebar-brand-text p { font-size: 11px; color: var(--sidebar-text); margin-top: 1px; }
.sidebar-section { padding: 0 12px; margin-top: 4px; }
.sidebar-section-label { font-size: 10px; font-weight: 600; color: #475569; text-transform: uppercase; letter-spacing: 0.8px; padding: 16px 8px 6px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: var(--radius); cursor: pointer; font-size: 13px; color: var(--sidebar-text); margin-bottom: 1px; transition: all 0.15s; border: none; background: none; width: 100%; text-align: left; font-weight: 400; }
.nav-item:hover { background: var(--sidebar-hover); color: var(--sidebar-text-active); }
.nav-item.active { background: var(--sidebar-active); color: #38bdf8; font-weight: 500; }
.nav-item svg { width: 18px; height: 18px; flex-shrink: 0; opacity: 0.6; }
.nav-item.active svg { opacity: 1; color: #38bdf8; }
.nav-badge { margin-left: auto; background: var(--red); color: #fff; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 99px; line-height: 14px; }
.sidebar-footer { padding: 16px 20px; border-top: 1px solid #1e293b; margin-top: auto; display: flex; align-items: center; gap: 10px; }
.sidebar-footer-avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #6366f1, #8b5cf6); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #fff; flex-shrink: 0; }
.sidebar-footer-info p:first-child { font-size: 12px; font-weight: 500; color: #e2e8f0; }
.sidebar-footer-info p:last-child { font-size: 11px; color: #64748b; }

/* ========== MAIN ========== */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
.topbar { padding: 18px 28px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.topbar-left h2 { font-size: 18px; font-weight: 700; color: var(--text); letter-spacing: -0.3px; }
.topbar-left p { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
.topbar-actions { display: flex; gap: 8px; }
.content { flex: 1; overflow-y: auto; padding: 24px 28px; }

/* ========== BUTTONS ========== */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: var(--radius); font-size: 13px; font-weight: 500; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; transition: all 0.15s; white-space: nowrap; line-height: 1.3; box-shadow: var(--shadow); }
.btn:hover { background: var(--surface-hover); border-color: #cbd5e1; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 1px 3px rgba(13,148,136,0.3); }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-danger { color: var(--red); border-color: #fecaca; }
.btn-danger:hover { background: var(--red-light); }
.btn-ghost { border: none; box-shadow: none; background: transparent; color: var(--text-secondary); }
.btn-ghost:hover { background: var(--border-light); color: var(--text); }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn-icon { width: 34px; height: 34px; padding: 0; justify-content: center; box-shadow: none; }
.btn svg { width: 15px; height: 15px; flex-shrink: 0; }
.btn-sm svg { width: 13px; height: 13px; }

/* ========== STAT CARDS ========== */
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
.stat-card { background: var(--surface); border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.stat-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; border-radius: 4px 0 0 4px; }
.stat-card:nth-child(1)::before { background: var(--accent); }
.stat-card:nth-child(2)::before { background: var(--amber); }
.stat-card:nth-child(3)::before { background: var(--blue); }
.stat-card:nth-child(4)::before { background: var(--purple); }
.stat-card .stat-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; }
.stat-card:nth-child(1) .stat-icon { background: var(--accent-light); color: var(--accent); }
.stat-card:nth-child(2) .stat-icon { background: var(--amber-light); color: var(--amber); }
.stat-card:nth-child(3) .stat-icon { background: var(--blue-light); color: var(--blue); }
.stat-card:nth-child(4) .stat-icon { background: var(--purple-light); color: var(--purple); }
.stat-card .stat-icon svg { width: 20px; height: 20px; }
.stat-card .label { font-size: 12px; color: var(--text-muted); font-weight: 500; margin-bottom: 4px; }
.stat-card .value { font-size: 32px; font-weight: 700; color: var(--text); line-height: 1; letter-spacing: -1px; }
.stat-card .delta { font-size: 12px; color: var(--accent); margin-top: 8px; font-weight: 500; }

.section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.section-title { font-size: 14px; font-weight: 600; color: var(--text); }
.section-subtitle { font-size: 12px; color: var(--text-muted); }
.card { background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow); overflow: hidden; }

/* ========== POSITIONS GRID ========== */
.pos-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 32px; }
.pos-card { background: var(--surface); border-radius: var(--radius-lg); padding: 18px; cursor: pointer; transition: all 0.2s; box-shadow: var(--shadow); border: 1px solid transparent; }
.pos-card:hover { border-color: var(--accent); box-shadow: var(--shadow-md); transform: translateY(-1px); }
.pos-card h3 { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
.pos-card .meta { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
.pos-card .footer { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border-light); }
.pos-add { background: var(--surface); border: 2px dashed var(--border); border-radius: var(--radius-lg); padding: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; font-weight: 500; color: var(--text-muted); transition: all 0.2s; min-height: 120px; }
.pos-add:hover { border-color: var(--accent); color: var(--accent); background: #f0fdfa; }

/* ========== PILLS ========== */
.pill { font-size: 11px; padding: 3px 10px; border-radius: 6px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; line-height: 1.4; letter-spacing: 0.01em; }
.pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; }
.pill-green { background: var(--accent-light); color: var(--accent-text); }
.pill-green::before { background: var(--accent); }
.pill-amber { background: var(--amber-light); color: var(--amber-text); }
.pill-amber::before { background: var(--amber); }
.pill-blue { background: var(--blue-light); color: var(--blue-text); }
.pill-blue::before { background: var(--blue); }
.pill-gray { background: var(--border-light); color: var(--text-secondary); }
.pill-gray::before { background: var(--text-muted); }
.pill-red { background: var(--red-light); color: var(--red-text); }
.pill-red::before { background: var(--red); }

/* ========== APPLICATION ROWS ========== */
.app-list { display: flex; flex-direction: column; gap: 8px; }
.app-row { background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow); overflow: hidden; transition: box-shadow 0.15s; }
.app-row:hover { box-shadow: var(--shadow-md); }
.app-header { display: flex; align-items: center; gap: 14px; padding: 14px 18px; cursor: pointer; }
.avatar { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; letter-spacing: -0.3px; }
.avatar-green { background: var(--accent-light); color: var(--accent-text); }
.avatar-blue { background: var(--blue-light); color: var(--blue-text); }
.avatar-amber { background: var(--amber-light); color: var(--amber-text); }
.app-info { flex: 1; min-width: 0; }
.app-info h4 { font-size: 14px; font-weight: 600; color: var(--text); }
.app-info p { font-size: 12px; color: var(--text-muted); }
.app-actions { display: flex; gap: 4px; }
.chevron { font-size: 12px; color: var(--text-muted); transition: transform 0.2s; margin-left: 4px; user-select: none; }
.app-row.expanded .chevron { transform: rotate(180deg); }
.app-detail { border-top: 1px solid var(--border-light); padding: 18px; background: #fafbfc; display: none; }
.app-row.expanded .app-detail { display: block; }
.detail-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 16px; }
.detail-item .label { font-size: 11px; color: var(--text-muted); margin-bottom: 3px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.3px; }
.detail-item .val { font-size: 13px; color: var(--text); font-weight: 500; }
.activity-list { margin-bottom: 16px; padding: 14px; background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border-light); }
.activity-list .title { font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 8px; }
.activity-row { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--text-secondary); padding: 5px 0; }
.activity-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.dot-green { background: var(--accent); }
.dot-blue { background: var(--blue); }
.dot-amber { background: var(--amber); }
.dot-red { background: var(--red); }
.dot-gray { background: var(--text-muted); }
.action-row { display: flex; gap: 8px; flex-wrap: wrap; }

/* ========== TOOLBAR ========== */
.toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
.search-box { position: relative; flex: 1; max-width: 300px; }
.search-box input { width: 100%; padding: 9px 12px 9px 36px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 13px; background: var(--surface); color: var(--text); outline: none; transition: all 0.15s; box-shadow: var(--shadow); }
.search-box input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(13,148,136,0.1); }
.search-box input::placeholder { color: var(--text-muted); }
.search-box svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-muted); }
.filter-select { padding: 9px 32px 9px 12px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 13px; background: var(--surface); color: var(--text); outline: none; appearance: none; background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%2394a3b8' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"); background-repeat: no-repeat; background-position: right 10px center; cursor: pointer; box-shadow: var(--shadow); transition: all 0.15s; font-weight: 500; }
.filter-select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(13,148,136,0.1); }
.toolbar-count { font-size: 13px; color: var(--text-muted); margin-left: auto; font-weight: 500; }

/* ========== CALENDAR ========== */
.cal-container { display: grid; grid-template-columns: 1fr 320px; gap: 20px; }
.cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.cal-header h3 { font-size: 16px; font-weight: 700; letter-spacing: -0.2px; }
.cal-nav { display: flex; gap: 4px; align-items: center; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
.cal-day-label { text-align: center; font-size: 11px; font-weight: 600; color: var(--text-muted); padding: 10px 0; text-transform: uppercase; letter-spacing: 0.5px; }
.cal-day { min-height: 84px; border: 1px solid var(--border-light); padding: 6px 8px; cursor: pointer; transition: background 0.1s; }
.cal-day:hover { background: var(--surface-hover); }
.cal-day.today { background: #f0fdfa; }
.cal-day.other-month { opacity: 0.3; }
.cal-day .day-num { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; }
.cal-day.today .day-num { color: var(--accent); background: var(--accent-light); width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
.cal-event { font-size: 10px; background: var(--accent-light); color: var(--accent-text); padding: 2px 6px; border-radius: 4px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.cal-sidebar-panel { }
.cal-sidebar-panel h3 { font-size: 15px; font-weight: 700; margin-bottom: 16px; letter-spacing: -0.2px; }
.interview-card { padding: 14px; background: var(--surface); border-radius: var(--radius); margin-bottom: 10px; box-shadow: var(--shadow); border: 1px solid var(--border-light); }
.interview-card h4 { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
.interview-card p { font-size: 12px; color: var(--text-muted); }
.interview-card .time-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--accent); margin-top: 6px; background: var(--accent-light); padding: 3px 8px; border-radius: 6px; }
.interview-card .actions { display: flex; gap: 6px; margin-top: 10px; }

/* ========== POSITIONS PAGE ========== */
.positions-list { display: flex; flex-direction: column; gap: 12px; }
.position-row { background: var(--surface); border-radius: var(--radius-lg); padding: 20px 22px; display: flex; align-items: center; gap: 18px; box-shadow: var(--shadow); transition: all 0.15s; }
.position-row:hover { box-shadow: var(--shadow-md); }
.position-row .pos-icon { width: 44px; height: 44px; border-radius: 12px; background: var(--accent-light); color: var(--accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.position-row .pos-icon svg { width: 22px; height: 22px; }
.position-row .info { flex: 1; }
.position-row h3 { font-size: 15px; font-weight: 600; margin-bottom: 3px; }
.position-row .meta { font-size: 12px; color: var(--text-muted); }
.position-row .stats { display: flex; gap: 24px; align-items: center; }
.position-row .stat-item { text-align: center; }
.position-row .stat-item .num { font-size: 20px; font-weight: 700; color: var(--text); }
.position-row .stat-item .lbl { font-size: 11px; color: var(--text-muted); font-weight: 500; }

/* ========== EMAIL PAGE ========== */
.email-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.email-panel { background: var(--surface); border-radius: var(--radius-lg); padding: 22px; box-shadow: var(--shadow); }
.email-panel h3 { font-size: 15px; font-weight: 700; margin-bottom: 18px; letter-spacing: -0.2px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 13px; background: var(--surface); color: var(--text); outline: none; transition: all 0.15s; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(13,148,136,0.1); }
.form-group textarea { min-height: 180px; resize: vertical; line-height: 1.6; }
.email-entry { padding: 14px 16px; border-bottom: 1px solid var(--border-light); cursor: pointer; transition: background 0.1s; border-radius: var(--radius); }
.email-entry:last-child { border-bottom: none; }
.email-entry:hover { background: var(--border-light); }
.email-entry h4 { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
.email-entry .meta { font-size: 12px; color: var(--text-muted); }
.email-entry .body-preview { font-size: 12px; color: var(--text-secondary); margin-top: 8px; display: none; white-space: pre-wrap; background: var(--border-light); padding: 12px; border-radius: var(--radius); line-height: 1.5; }
.email-entry.expanded .body-preview { display: block; }

/* ========== HISTORY ========== */
.timeline { position: relative; padding-left: 28px; }
.timeline::before { content: ''; position: absolute; left: 9px; top: 4px; bottom: 4px; width: 2px; background: var(--border); border-radius: 1px; }
.timeline-item { position: relative; padding: 10px 0 10px 16px; }
.timeline-dot { position: absolute; left: -23px; top: 16px; width: 12px; height: 12px; border-radius: 50%; border: 3px solid var(--bg); box-shadow: 0 0 0 2px var(--border); }
.timeline-item .time { font-size: 11px; color: var(--text-muted); margin-bottom: 3px; font-weight: 500; }
.timeline-item .desc { font-size: 13px; color: var(--text); font-weight: 500; }
.timeline-item .sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

/* ========== MODAL ========== */
.modal-backdrop { position: fixed; inset: 0; background: rgba(15,23,42,0.5); backdrop-filter: blur(4px); z-index: 1000; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s; }
.modal-backdrop.visible { opacity: 1; }
.modal { background: var(--surface); border-radius: var(--radius-xl); box-shadow: var(--shadow-lg); width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
.modal-header { padding: 20px 24px; border-bottom: 1px solid var(--border-light); display: flex; align-items: center; justify-content: space-between; }
.modal-header h3 { font-size: 16px; font-weight: 700; letter-spacing: -0.2px; }
.modal-close { width: 30px; height: 30px; border: none; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: var(--radius); color: var(--text-muted); font-size: 20px; transition: all 0.15s; }
.modal-close:hover { background: var(--border-light); color: var(--text); }
.modal-body { padding: 20px 24px; }
.modal-footer { padding: 16px 24px; border-top: 1px solid var(--border-light); display: flex; justify-content: flex-end; gap: 8px; }

/* ========== EMPTY STATE ========== */
.empty-state { text-align: center; padding: 48px 20px; color: var(--text-muted); }
.empty-state svg { width: 48px; height: 48px; margin-bottom: 16px; opacity: 0.3; }
.empty-state h4 { font-size: 15px; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; }
.empty-state p { font-size: 13px; }

/* ========== TOAST ========== */
.toast { position: fixed; bottom: 24px; right: 24px; background: var(--sidebar-bg); color: #e2e8f0; padding: 14px 20px; border-radius: var(--radius-lg); font-size: 13px; font-weight: 500; z-index: 2000; box-shadow: var(--shadow-lg); transform: translateY(80px); opacity: 0; transition: all 0.3s ease; display: flex; align-items: center; gap: 8px; }
.toast::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
.toast.show { transform: translateY(0); opacity: 1; }

/* ========== SCROLLBAR ========== */
.content::-webkit-scrollbar { width: 6px; }

function fmtDate(d) {
  if (!d) return '—';
  const date = new Date(d + 'T00:00:00');
  return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}
function fmtDateTime(d, t) {
  if (!d) return '—';
  const date = new Date(d + 'T' + (t || '00:00'));
  return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' at ' +
    date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}
function fmtTime(t) {
  if (!t) return '';
  const [h, m] = t.split(':');
  return new Date(2000, 0, 1, +h, +m).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}
function relTime(dateStr) {
  const d = new Date(dateStr); const now = new Date(); const diff = now - d;
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return 'Just now';
  if (mins < 60) return mins + 'm ago';
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + 'h ago';
  const days = Math.floor(hrs / 24);
  if (days < 7) return days + 'd ago';
  return fmtDate(dateStr.split('T')[0]);
}

let store;
function loadStore() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { store = JSON.parse(raw); if (!store.positions || !store.applicants) throw 0; }
    else { store = JSON.parse(JSON.stringify(DEFAULT_DATA)); saveStore(); }
  } catch { store = JSON.parse(JSON.stringify(DEFAULT_DATA)); saveStore(); }
}
function saveStore() { localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); }
function resetStore() { store = JSON.parse(JSON.stringify(DEFAULT_DATA)); saveStore(); }
function addEvent(type, desc, applicantId, positionId) {
  store.events.push({ id: uid(), type, desc, applicantId: applicantId || null, positionId: positionId || null, ts: new Date().toISOString() });
  saveStore();
}
function getPosition(id) { return store.positions.find(p => p.id === id); }
function getApplicant(id) { return store.applicants.find(a => a.id === id); }
function getApplicantsForPosition(posId) { return store.applicants.filter(a => a.positionId === posId); }
function getEventsForApplicant(appId) { return store.events.filter(e => e.applicantId === appId).sort((a, b) => new Date(b.ts) - new Date(a.ts)); }

function showToast(msg) {
  const el = document.getElementById('toast');
  el.innerHTML = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2800);
}

function showModal(html) {
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal-backdrop" onclick="if(event.target===this)hideModal()"><div class="modal">${html}</div></div>`;
  requestAnimationFrame(() => root.querySelector('.modal-backdrop').classList.add('visible'));
  document.addEventListener('keydown', _mk);
}
function hideModal() {
  const root = document.getElementById('modal-root');
  const bd = root.querySelector('.modal-backdrop');
  if (bd) { bd.classList.remove('visible'); setTimeout(() => root.innerHTML = '', 180); }
  document.removeEventListener('keydown', _mk);
}
function _mk(e) { if (e.key === 'Escape') hideModal(); }

function navigate(page) {
  currentPage = page;
  pageState = {};
  renderSidebar();
  renderTopbar();
  renderPage();
  document.getElementById('content').scrollTop = 0;
}

function renderSidebar() {
  const pending = store.applicants.filter(a => a.status === 'new' || a.status === 'under_review').length;
  document.getElementById('sidebar-nav').innerHTML = PAGES.map(p =>
    `<button class="nav-item${currentPage === p.id ? ' active' : ''}" onclick="navigate('${p.id}')">
      ${I[p.icon]}${p.label}${p.badge && pending > 0 ? `<span class="nav-badge">${pending}</span>` : ''}
    </button>`
  ).join('') + `<button class="nav-item" onclick="confirmReset()" style="margin-top:24px;opacity:0.5">${I.reset} Reset demo</button>`;
}

function confirmReset() {
  showModal(`<div class="modal-header"><h3>Reset all data?</h3><button class="modal-close" onclick="hideModal()">&times;</button></div>
    <div class="modal-body"><p style="font-size:13px;color:var(--text-secondary)">Restore all positions, applicants, emails, and history to demo defaults. This cannot be undone.</p></div>
    <div class="modal-footer"><button class="btn" onclick="hideModal()">Cancel</button><button class="btn btn-primary" onclick="resetStore();hideModal();navigate(currentPage);showToast('Data reset to defaults')">Reset data</button></div>`);
}

function renderTopbar() {
  const t = document.getElementById('topbar');
  const titles = {
    overview: ['Overview', 'Spring 2025 admission cycle'],
    applications: ['Applications', `${store.applicants.length} total applicants`],
    interviews: ['Interview Calendar', 'Schedule and manage interviews'],
    positions: ['Volunteer Positions', `${store.positions.length} active positions`],
    email: ['Email Center', 'Compose and track messages'],
    history: ['Activity Log', 'Complete event timeline']

  const [title, sub] = titles[currentPage] || ['', ''];
  let actions = '';
  if (currentPage === 'overview') actions = `<button class="btn" onclick="navigate('email')">${I.send} Send emails</button><button class="btn btn-primary" onclick="openPositionModal()">${I.plus} New position</button>`;
  else if (currentPage === 'applications') actions = `<button class="btn btn-primary" onclick="openAddApplicantModal()">${I.plus} Add applicant</button>`;

}

        ${events.slice(0, 5).map(ev => `<div class="activity-row"><div class="activity-dot ${evDot(ev.type)}"></div>${esc(ev.desc)} · ${relTime(ev.ts)}</div>`).join('')}

function actionButtons(a) {
  let b = '';
  if (a.status === 'new') {
    b += `<button class="btn btn-sm" onclick="changeStatus('${a.id}','under_review')">Start review</button>`;
    b += `<button class="btn btn-primary btn-sm" onclick="openScheduleModal('${a.id}')">Schedule interview</button>`;
    b += `<button class="btn btn-sm" onclick="openEmailFor('${a.id}')">Send email</button>`;
    b += `<button class="btn btn-danger btn-sm" onclick="confirmDecline('${a.id}')">Decline</button>`;
  } else if (a.status === 'under_review') {
    b += `<button class="btn btn-primary btn-sm" onclick="openScheduleModal('${a.id}')">Schedule interview</button>`;
    b += `<button class="btn btn-sm" onclick="openEmailFor('${a.id}')">Send email</button>`;
    b += `<button class="btn btn-danger btn-sm" onclick="confirmDecline('${a.id}')">Decline</button>`;
  } else if (a.status === 'interview_scheduled') {
    b += `<button class="btn btn-primary btn-sm" onclick="changeStatus('${a.id}','accepted')">${I.check} Accept</button>`;
    b += `<button class="btn btn-sm" onclick="openScheduleModal('${a.id}')">Reschedule</button>`;
    b += `<button class="btn btn-sm" onclick="openEmailFor('${a.id}')">Send reminder</button>`;
    b += `<button class="btn btn-danger btn-sm" onclick="confirmDecline('${a.id}')">Decline</button>`;
  } else if (a.status === 'accepted') {
    b += `<button class="btn btn-sm" onclick="openEmailFor('${a.id}')">Send email</button>`;
  } else if (a.status === 'declined') {
    b += `<button class="btn btn-sm" onclick="changeStatus('${a.id}','new')">Reopen</button>`;
    b += `<button class="btn btn-sm" onclick="openEmailFor('${a.id}')">Send email</button>`;
  }
  return b;
}

function statusPill(s) {
  return { new: { label: 'New', cls: 'pill-gray' }, under_review: { label: 'Reviewing', cls: 'pill-amber' }, interview_scheduled: { label: 'Interview set', cls: 'pill-blue' }, accepted: { label: 'Accepted', cls: 'pill-green' }, declined: { label: 'Declined', cls: 'pill-red' } }[s] || { label: s, cls: 'pill-gray' };
}
function evDot(t) { return { application: 'dot-blue', status: 'dot-amber', email: 'dot-gray', interview: 'dot-green' }[t] || 'dot-gray'; }
function dotBg(t) { return { application: 'var(--blue)', status: 'var(--amber)', email: 'var(--text-muted)', interview: 'var(--accent)' }[t] || 'var(--text-muted)'; }
function toggleRow(id) { document.getElementById('row-' + id)?.classList.toggle('expanded'); }

// =====================================================================
//  APPLICATIONS PAGE
// =====================================================================
function renderApplications() {
  let apps = [...store.applicants];
  const q = (pageState.search || '').toLowerCase();
  const sf = pageState.statusFilter || 'all';
  const pf = pageState.posFilter || 'all';
  const sort = pageState.sort || 'newest';
  if (q) apps = apps.filter(a => a.name.toLowerCase().includes(q) || a.email.toLowerCase().includes(q));
  if (sf !== 'all') apps = apps.filter(a => a.status === sf);
  if (pf !== 'all') apps = apps.filter(a => a.positionId === pf);
  if (sort === 'newest') apps.sort((a, b) => new Date(b.appliedAt) - new Date(a.appliedAt));
  else if (sort === 'oldest') apps.sort((a, b) => new Date(a.appliedAt) - new Date(b.appliedAt));
  else if (sort === 'name') apps.sort((a, b) => a.name.localeCompare(b.name));
  else if (sort === 'gpa') apps.sort((a, b) => b.gpa - a.gpa);

  return `<div class="toolbar">
    <div class="search-box">${I.search}<input type="text" placeholder="Search by name or email..." value="${esc(pageState.search || '')}" oninput="pageState.search=this.value;renderPage()"></div>
    <select class="filter-select" onchange="pageState.statusFilter=this.value;renderPage()">
      <option value="all"${sf==='all'?' selected':''}>All statuses</option><option value="new"${sf==='new'?' selected':''}>New</option><option value="under_review"${sf==='under_review'?' selected':''}>Reviewing</option><option value="interview_scheduled"${sf==='interview_scheduled'?' selected':''}>Interview set</option><option value="accepted"${sf==='accepted'?' selected':''}>Accepted</option><option value="declined"${sf==='declined'?' selected':''}>Declined</option>
    </select>
    <select class="filter-select" onchange="pageState.posFilter=this.value;renderPage()">
      <option value="all"${pf==='all'?' selected':''}>All positions</option>${store.positions.map(p=>`<option value="${p.id}"${pf===p.id?' selected':''}>${esc(p.title)}</option>`).join('')}
    </select>
    <select class="filter-select" onchange="pageState.sort=this.value;renderPage()">
      <option value="newest"${sort==='newest'?' selected':''}>Newest first</option><option value="oldest"${sort==='oldest'?' selected':''}>Oldest first</option><option value="name"${sort==='name'?' selected':''}>Name A-Z</option><option value="gpa"${sort==='gpa'?' selected':''}>Highest GPA</option>
    </select>
    <span class="toolbar-count">${apps.length} result${apps.length!==1?'s':''}</span>
  </div>
  <div class="app-list">${apps.length > 0 ? apps.map(a => renderAppRow(a)).join('') : '<div class="empty-state"><h4>No applications found</h4><p>Try adjusting your filters or search.</p></div>'}</div>`;
}

// =====================================================================
//  INTERVIEWS PAGE
// =====================================================================
function renderInterviews() {
  const now = new Date();
  const vy = pageState.calYear || now.getFullYear();
  const vm = pageState.calMonth !== undefined ? pageState.calMonth : now.getMonth();
  const ivs = store.applicants.filter(a => a.status === 'interview_scheduled' && a.interviewDate);
  const upcoming = [...ivs].sort((a, b) => new Date(a.interviewDate) - new Date(b.interviewDate));
  const first = new Date(vy, vm, 1), last = new Date(vy, vm + 1, 0);
  const dow = first.getDay(), dim = last.getDate();
  const mn = first.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;

  let cells = '';
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d => cells += `<div class="cal-day-label">${d}</div>`);
  const prev = new Date(vy, vm, 0).getDate();
  for (let i = dow-1; i >= 0; i--) cells += `<div class="cal-day other-month"><div class="day-num">${prev-i}</div></div>`;
  for (let d = 1; d <= dim; d++) {
    const ds = `${vy}-${String(vm+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const it = ds === todayStr;
    const di = ivs.filter(a => a.interviewDate === ds);
    cells += `<div class="cal-day${it?' today':''}" onclick="showDayDetail('${ds}')"><div class="day-num">${d}</div>${di.map(a=>`<div class="cal-event">${fmtTime(a.interviewTime)} ${esc(a.name.split(' ')[0])}</div>`).join('')}</div>`;
  }
  const rem = (7-(dow+dim)%7)%7;
  for (let i=1;i<=rem;i++) cells += `<div class="cal-day other-month"><div class="day-num">${i}</div></div>`;

  return `<div class="cal-container">
    <div><div class="card" style="padding:18px">
      <div class="cal-header"><h3>${mn}</h3><div class="cal-nav"><button class="btn btn-icon btn-sm" onclick="calNav(-1)">${I.chevL}</button><button class="btn btn-sm" onclick="calToday()">Today</button><button class="btn btn-icon btn-sm" onclick="calNav(1)">${I.chevR}</button></div></div>
      <div class="cal-grid">${cells}</div>
    </div></div>
    <div class="cal-sidebar-panel">
      <h3>Upcoming Interviews</h3>
      ${upcoming.length===0?'<p style="font-size:13px;color:var(--text-muted)">No interviews scheduled</p>':''}
      ${upcoming.map(a => { const pos = getPosition(a.positionId); return `<div class="interview-card">
        <h4>${esc(a.name)}</h4><p>${pos?esc(pos.title):''}</p>
        <div class="time-badge">${I.cal} ${fmtDateTime(a.interviewDate, a.interviewTime)}</div>
        <div class="actions"><button class="btn btn-primary btn-sm" onclick="changeStatus('${a.id}','accepted')">${I.check} Accept</button><button class="btn btn-sm" onclick="openScheduleModal('${a.id}')">Reschedule</button><button class="btn btn-danger btn-sm" onclick="confirmDecline('${a.id}')">Decline</button></div>
      </div>`; }).join('')}
    </div>
  </div>`;
}
function calNav(dir) { const now=new Date(); let m=pageState.calMonth!==undefined?pageState.calMonth:now.getMonth(), y=pageState.calYear||now.getFullYear(); m+=dir; if(m<0){m=11;y--} if(m>11){m=0;y++} pageState.calMonth=m; pageState.calYear=y; renderPage(); }
function calToday() { const n=new Date(); pageState.calMonth=n.getMonth(); pageState.calYear=n.getFullYear(); renderPage(); }
function showDayDetail(ds) {
  const di=store.applicants.filter(a=>a.interviewDate===ds&&a.status==='interview_scheduled');
  const d=new Date(ds+'T00:00:00');
  const f=d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  showModal(`<div class="modal-header"><h3>${f}</h3><button class="modal-close" onclick="hideModal()">&times;</button></div>
    <div class="modal-body">${di.length===0?'<p style="color:var(--text-muted)">No interviews on this day.</p><p style="margin-top:8px;font-size:13px;color:var(--text-secondary)">Schedule interviews from the Applications page.</p>':''}
    ${di.map(a=>{const pos=getPosition(a.positionId);return`<div class="interview-card" style="margin-bottom:10px"><h4>${esc(a.name)}</h4><p>${pos?esc(pos.title):''} · ${fmtTime(a.interviewTime)}</p><div class="actions"><button class="btn btn-primary btn-sm" onclick="changeStatus('${a.id}','accepted');hideModal()">${I.check} Accept</button><button class="btn btn-danger btn-sm" onclick="confirmDecline('${a.id}');hideModal()">Decline</button></div></div>`;}).join('')}</div>`);
}

function applyTmpl() {
  const tmpl=document.getElementById('email-template').value, toSel=document.getElementById('email-to');
  const app=toSel.value?getApplicant(toSel.value):null;
  const name=app?app.name.split(' ')[0]:'[Name]';
  const pos=app?getPosition(app.positionId):null;
  const pt=pos?pos.title:'[Position]';
  const subj=document.getElementById('email-subject'), body=document.getElementById('email-body');
  const T={
    schedule:{subject:`Interview Scheduling — ${pt}`,body:`Hi ${name},\n\nThank you for applying to the ${pt} position at our clinic.\n\nWe'd like to invite you for a brief interview. Please let us know your availability for the coming week.\n\nBest regards,\nDr. Sarah Chen`},
    reminder:{subject:`Interview Reminder — ${pt}`,body:`Hi ${name},\n\nThis is a friendly reminder about your upcoming interview for the ${pt} position.\n\nPlease arrive 5 minutes early and bring a valid student ID.\n\nBest regards,\nDr. Sarah Chen`},
    acceptance:{subject:`Congratulations! — ${pt}`,body:`Hi ${name},\n\nWe're pleased to inform you that you've been accepted for the ${pt} position!\n\nYou'll receive onboarding details shortly. We're excited to have you on the team.\n\nBest regards,\nDr. Sarah Chen`},
    rejection:{subject:`Application Update — ${pt}`,body:`Hi ${name},\n\nThank you for your interest in the ${pt} position.\n\nAfter careful consideration, we've decided to move forward with other candidates at this time. We encourage you to apply again in future cycles.\n\nBest regards,\nDr. Sarah Chen`}
  };
  if(T[tmpl]){subj.value=T[tmpl].subject;body.value=T[tmpl].body;}
}

function sendEmail() {
  const to=document.getElementById('email-to'), subj=document.getElementById('email-subject'), body=document.getElementById('email-body');
  if(!to.value){showToast('Select a recipient');return;} if(!subj.value.trim()){showToast('Enter a subject');return;} if(!body.value.trim()){showToast('Enter a message');return;}
  const app=getApplicant(to.value);
  store.emails.push({id:uid(),to:app.email,toName:app.name,applicantId:app.id,subject:subj.value.trim(),body:body.value.trim(),sentAt:new Date().toISOString()});
  addEvent('email',`Email sent: "${subj.value.trim()}"`,app.id,app.positionId);
  showToast(`Email sent to ${app.name}`);
  renderPage(); renderSidebar();
}

function openScheduleModal(appId) {
  const a=getApplicant(appId); if(!a)return;
  const today=new Date().toISOString().split('T')[0];
  showModal(`<div class="modal-header"><h3>Schedule Interview</h3><button class="modal-close" onclick="hideModal()">&times;</button></div>
    <div class="modal-body">
      <p style="font-size:13px;color:var(--text-secondary);margin-bottom:18px">Scheduling for <strong>${esc(a.name)}</strong></p>
      <div class="form-group"><label>Date</label><input type="date" id="sd" min="${today}" value="${a.interviewDate||''}"></div>
      <div class="form-group"><label>Time</label><input type="time" id="st" value="${a.interviewTime||'10:00'}"></div>
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-secondary);cursor:pointer;margin-top:8px"><input type="checkbox" id="se" checked> Send scheduling email <!-- NOTE: Logged locally; real delivery requires backend --></label>
    </div>
    <div class="modal-footer"><button class="btn" onclick="hideModal()">Cancel</button><button class="btn btn-primary" onclick="submitSchedule('${appId}')">Schedule</button></div>`);
}
function submitSchedule(appId) {
  const date=document.getElementById('sd').value, time=document.getElementById('st').value, sendE=document.getElementById('se').checked;
  if(!date){showToast('Select a date');return;} if(!time){showToast('Select a time');return;}
  const a=getApplicant(appId); a.interviewDate=date; a.interviewTime=time; a.status='interview_scheduled';
  addEvent('interview',`Interview scheduled for ${fmtDateTime(date,time)}`,appId,a.positionId);
  addEvent('status','Status changed to Interview Scheduled',appId,a.positionId);
  if(sendE){const pos=getPosition(a.positionId);store.emails.push({id:uid(),to:a.email,toName:a.name,applicantId:a.id,subject:`Interview Scheduled — ${pos?pos.title:'Position'}`,body:`Hi ${a.name.split(' ')[0]},\n\nYour interview has been scheduled for ${fmtDateTime(date,time)}.\n\nPlease arrive 5 minutes early with a valid student ID.\n\nBest regards,\nDr. Sarah Chen`,sentAt:new Date().toISOString()});addEvent('email','Scheduling email sent',a.id,a.positionId);}
  saveStore(); hideModal(); showToast(`Interview scheduled for ${a.name}`); renderSidebar(); renderTopbar(); renderPage();
}
function openEmailFor(appId) { navigate('email'); setTimeout(()=>{const el=document.getElementById('email-to');if(el)el.value=appId;},50); }
function changeStatus(appId,ns) {
  const a=getApplicant(appId); if(!a)return; a.status=ns;
  const labels={new:'New',under_review:'Under Review',interview_scheduled:'Interview Scheduled',accepted:'Accepted',declined:'Declined'};
  addEvent('status',`Status changed to ${labels[ns]||ns}`,appId,a.positionId);
  if(ns==='accepted'){const pos=getPosition(a.positionId);store.emails.push({id:uid(),to:a.email,toName:a.name,applicantId:a.id,subject:`Congratulations! — ${pos?pos.title:'Position'}`,body:`Hi ${a.name.split(' ')[0]},\n\nYou've been accepted for the ${pos?pos.title:''} position. Onboarding details to follow.\n\nBest,\nDr. Sarah Chen`,sentAt:new Date().toISOString()});addEvent('email','Acceptance email sent',a.id,a.positionId);}
  saveStore(); showToast(`${a.name} — ${labels[ns]}`); renderSidebar(); renderTopbar(); renderPage();
}
function confirmDecline(appId) {
  const a=getApplicant(appId); if(!a)return;
  showModal(`<div class="modal-header"><h3>Decline Applicant</h3><button class="modal-close" onclick="hideModal()">&times;</button></div>
    <div class="modal-body"><p style="font-size:13px;color:var(--text-secondary)">Decline <strong>${esc(a.name)}</strong>?</p>
    <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-secondary);cursor:pointer;margin-top:12px"><input type="checkbox" id="de" checked> Send rejection email <!-- NOTE: Logged locally --></label></div>
    <div class="modal-footer"><button class="btn" onclick="hideModal()">Cancel</button><button class="btn btn-danger" onclick="submitDecline('${appId}')">Decline</button></div>`);
}
function submitDecline(appId) {
  const sendE=document.getElementById('de')?.checked;
  const a=getApplicant(appId); a.status='declined'; a.interviewDate=null; a.interviewTime=null;
  addEvent('status','Declined',appId,a.positionId);
  if(sendE){const pos=getPosition(a.positionId);store.emails.push({id:uid(),to:a.email,toName:a.name,applicantId:a.id,subject:`Application Update — ${pos?pos.title:'Position'}`,body:`Hi ${a.name.split(' ')[0]},\n\nThank you for your interest. We've decided to move forward with other candidates. We encourage you to apply again.\n\nBest,\nDr. Sarah Chen`,sentAt:new Date().toISOString()});addEvent('email','Rejection email sent',a.id,a.positionId);}
  saveStore(); hideModal(); showToast(`${a.name} declined`); renderSidebar(); renderTopbar(); renderPage();
}
function openPositionModal(posId) {
  const p=posId?getPosition(posId):null; const isEdit=!!p;
  showModal(`<div class="modal-header"><h3>${isEdit?'Edit':'New'} Position</h3><button class="modal-close" onclick="hideModal()">&times;</button></div>
    <div class="modal-body">
      <div class="form-group"><label>Title</label><input type="text" id="pt" value="${p?esc(p.title):''}" placeholder="e.g. Patient Intake Volunteer"></div>
      <div class="form-group"><label>Schedule</label><input type="text" id="ps" value="${p?esc(p.schedule):''}" placeholder="e.g. Tuesdays, Flexible"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
        <div class="form-group"><label>Hours/week</label><input type="number" id="ph" min="1" max="40" value="${p?p.hoursPerWeek:'4'}"></div>
        <div class="form-group"><label>Open slots</label><input type="number" id="pl" min="1" max="50" value="${p?p.slots:'3'}"></div>
      </div>
      <div class="form-group"><label>Status</label><select id="px"><option value="open"${p&&p.status==='open'?' selected':''}>Open</option><option value="reviewing"${p&&p.status==='reviewing'?' selected':''}>Reviewing</option><option value="closed"${p&&p.status==='closed'?' selected':''}>Closed</option></select></div>
      <div class="form-group"><label>Description</label><textarea id="pd" rows="3" placeholder="Brief description...">${p?esc(p.description||''):''}</textarea></div>
    </div>
    <div class="modal-footer"><button class="btn" onclick="hideModal()">Cancel</button><button class="btn btn-primary" onclick="submitPosition('${posId||''}')">${isEdit?'Save':'Create'}</button></div>`);
}
function submitPosition(posId) {
  const title=document.getElementById('pt').value.trim(); if(!title){showToast('Enter a title');return;}
  const data={title,schedule:document.getElementById('ps').value.trim(),hoursPerWeek:parseInt(document.getElementById('ph').value)||4,slots:parseInt(document.getElementById('pl').value)||3,status:document.getElementById('px').value,description:document.getElementById('pd').value.trim()};
  if(posId){const p=getPosition(posId);Object.assign(p,data);addEvent('status',`Position updated: "${title}"`,null,posId);showToast('Position updated');}
  else{const np={id:uid(),...data,createdAt:new Date().toISOString().split('T')[0]};store.positions.push(np);addEvent('status',`Position created: "${title}"`,null,np.id);showToast('Position created');}
  saveStore();hideModal();renderSidebar();renderTopbar();renderPage();
}
function confirmDeletePosition(posId) {
  const p=getPosition(posId);if(!p)return;const c=getApplicantsForPosition(posId).length;
  showModal(`<div class="modal-header"><h3>Delete Position</h3><button class="modal-close" onclick="hideModal()">&times;</button></div>
    <div class="modal-body"><p style="font-size:13px;color:var(--text-secondary)">Delete <strong>${esc(p.title)}</strong>?</p>${c>0?`<p style="font-size:13px;color:var(--red);margin-top:8px">${c} applicant${c!==1?'s':''} will also be removed.</p>`:''}</div>
    <div class="modal-footer"><button class="btn" onclick="hideModal()">Cancel</button><button class="btn btn-danger" onclick="deletePosition('${posId}')">Delete</button></div>`);
}
function deletePosition(posId) {
  store.positions=store.positions.filter(p=>p.id!==posId);store.applicants=store.applicants.filter(a=>a.positionId!==posId);store.events=store.events.filter(e=>e.positionId!==posId);
  saveStore();hideModal();showToast('Position deleted');renderSidebar();renderTopbar();renderPage();
}
function openAddApplicantModal() {
  showModal(`<div class="modal-header"><h3>Add Applicant</h3><button class="modal-close" onclick="hideModal()">&times;</button></div>
    <div class="modal-body">
      <div class="form-group"><label>Full name</label><input type="text" id="an" placeholder="Jane Smith"></div>
      <div class="form-group"><label>Email</label><input type="email" id="ae" placeholder="jane@tamu.edu"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
        <div class="form-group"><label>GPA</label><input type="number" id="ag" step="0.01" min="0" max="4" value="3.5"></div>
        <div class="form-group"><label>Year</label><select id="ay"><option>Freshman</option><option>Sophomore</option><option selected>Junior</option><option>Senior</option></select></div>
      </div>
      <div class="form-group"><label>Major</label><input type="text" id="am" placeholder="Biology"></div>
      <div class="form-group"><label>Position</label><select id="ap">${store.positions.map(p=>`<option value="${p.id}">${esc(p.title)}</option>`).join('')}</select></div>
      <div class="form-group"><label>Availability</label><input type="text" id="aa" placeholder="Tue, Thu afternoons"></div>
      <!-- NOTE: In production, students apply through the student portal. This simulates manual admin entry. -->
    </div>
    <div class="modal-footer"><button class="btn" onclick="hideModal()">Cancel</button><button class="btn btn-primary" onclick="submitNewApplicant()">Add</button></div>`);
}
function submitNewApplicant() {
  const name=document.getElementById('an').value.trim(),email=document.getElementById('ae').value.trim();
  if(!name){showToast('Enter a name');return;} if(!email){showToast('Enter an email');return;}
  const na={id:uid(),name,email,gpa:parseFloat(document.getElementById('ag').value)||3.0,year:document.getElementById('ay').value,major:document.getElementById('am').value.trim(),availability:document.getElementById('aa').value.trim(),positionId:document.getElementById('ap').value,status:'new',appliedAt:new Date().toISOString().split('T')[0],color:AVATAR_COLORS[store.applicants.length%AVATAR_COLORS.length]};
  store.applicants.push(na);addEvent('application','Application submitted',na.id,na.positionId);
  saveStore();hideModal();showToast(`${name} added`);renderSidebar();renderTopbar();renderPage();
}

// =====================================================================
//  INIT
// =====================================================================
loadStore();
renderSidebar();
navigate('overview');
</script>
</body>
</html>
